# Pulls hf-token and vllm-api-key out of Key Vault and syncs them into a
# normal Kubernetes Secret so the vLLM container can read them as env vars.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: llm-kv
  namespace: llm
spec:
  provider: azure
  secretObjects:
    - secretName: llm-secrets          # the k8s Secret that gets created
      type: Opaque
      data:
        - objectName: hf-token
          key: HUGGING_FACE_HUB_TOKEN
        - objectName: vllm-api-key
          key: VLLM_API_KEY
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<clientID>"     # from 02-cluster-addons.sh output
    keyvaultName: "<keyvaultName>"
    tenantId: "<tenantId>"
    objects: |
      array:
        - |
          objectName: hf-token
          objectType: secret
        - |
          objectName: vllm-api-key
          objectType: secret
